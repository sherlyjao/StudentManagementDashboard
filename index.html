<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management Dashboard</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <h2 class="title">
      Student Management Dashboard
    </h2>

    <div class="dashboard-container">
      <div class="form-panel">
        <h3>Add New Student</h3>

        <form id="studentForm">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="e.g. Viktor" />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="e.g. Magtatanggol" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="email"
              placeholder="viktor.magtatanggol@example.com"
            />
          </div>
          <button id="submitButton" type="submit">Submit Record</button>
        </form>
      </div>

      <div class="table-panel">
        <h3>Registered Students</h3>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
            </tr>
          </thead>

          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
